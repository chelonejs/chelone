name: Set up
description: pnpm, Node and the workspace's dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
