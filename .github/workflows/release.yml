name: Release

# release-please reads the conventional commits since the last release and
# keeps a release pull request open with the version bump and each package's
# CHANGELOG. The six packages share one version (linked-versions). Merging that
# pull request makes the next run tag `@chelone/<name>@<version>` and create the
# GitHub releases, and the publish job then puts the new versions on npm.
#
# Publishing is npm trusted publishing (OIDC): no npm token, provenance
# attested. Each package's trusted publisher names this file, `release.yml`, in
# `chelonejs/chelone`, so keep the name. Only the publish job gets
# `id-token: write`.
#
# Every action is pinned to a commit: these jobs push tags and publish to npm.
#
# To retry a publish that failed after its release was created, run this
# workflow by hand: the publish job runs on workflow_dispatch and skips any
# version npm already has.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.repository == 'chelonejs/chelone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No registry-url: with it, setup-node writes an .npmrc that hands npm a
      # placeholder token, and npm publishes with it instead of using OIDC.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26 # ships npm >= 11.5.1, which trusted publishing needs
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm release:check
      # pnpm pack applies publishConfig and turns `workspace:*` into the
      # version; npm publishes the tarball, since npm is what does the OIDC
      # exchange.
      - name: Publish to npm
        run: |
          out=$(mktemp -d)
          # pnpm's order puts dependencies first, so a failure part way never
          # leaves a package on npm that needs a version that isn't there.
          for dir in $(pnpm --filter "./packages/*" --workspace-concurrency=1 exec pwd); do
            if [ "$(node -p "require('$dir/package.json').private === true")" = "true" ]; then
              continue
            fi
            name=$(node -p "require('$dir/package.json').name")
            version=$(node -p "require('$dir/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm"
              continue
            fi
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$out" | tail -n 1)
            npm publish "$tarball" --provenance --access public
          done
