name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pull requests cancel their older runs; each push to main keeps its own result.
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # HEAD^1 is main: the base of a pull request's merge commit, or main before a push.
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          cache-key: check
      - name: Release notes parse
        if: startsWith(github.head_ref, 'release-please--')
        run: pnpm check:release-notes ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Script tests
        run: pnpm test:scripts
      - name: Lint
        run: pnpm lint
      - name: No new duplication
        run: pnpm check:duplication
      - name: No new type escapes
        run: pnpm check:type-escapes --base HEAD^1
      - name: Every component is in the showcase
        run: pnpm check:showcase --base HEAD^1
      - name: Typecheck
        run: pnpm typecheck
      - name: Type cost within budget
        run: pnpm check:type-cost
      - name: Build
        run: pnpm build
      - name: Props pages are up to date
        run: |
          pnpm --dir apps/website props
          git add -N --ignore-removal apps/website/src/docs/content/props
          git diff --exit-code apps/website/src/docs/content/props || {
            echo "::error::Props pages are stale. Run pnpm --dir apps/website props and commit the output."
            exit 1
          }
      - name: Packages pack cleanly
        run: pnpm --filter "./packages/*" --if-present run check:pack
      - name: Registry is up to date
        run: |
          pnpm --dir packages/react registry:generate
          git diff --exit-code packages/react/registry.json || {
            echo "::error::registry.json is stale. Run pnpm --dir packages/react registry:generate and commit it."
            exit 1
          }
      - name: Registry builds
        run: pnpm --dir packages/react registry:build
      - name: Vue registry is up to date
        run: |
          pnpm --dir packages/vue registry:generate
          git diff --exit-code packages/vue/registry.json || {
            echo "::error::Vue registry.json is stale. Run pnpm --dir packages/vue registry:generate and commit it."
            exit 1
          }
      - name: Vue registry builds
        run: pnpm --dir packages/vue registry:build
      - name: Screenshots of what changed
        if: github.event_name == 'pull_request'
        run: |
          if [ "$(node scripts/showcase-shots.mjs --base HEAD^1 --count)" -gt 0 ]; then
            pnpm exec playwright install --with-deps chromium
          fi
          node scripts/showcase-shots.mjs --base HEAD^1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: showcase-shots
          path: .showcase-shots
          include-hidden-files: true
          if-no-files-found: ignore

  # The only job that can write. It runs none of the pull request's code, and a fork's
  # token cannot write at all, so a fork's pull request gets no screenshots.
  screenshots:
    needs: check
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: showcase-shots
          path: shots
      - name: Post them on the pull request
        if: hashFiles('shots/section.md') != ''
        run: |
          git init -q store
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin showcase-shots; then
            git checkout -q -b showcase-shots FETCH_HEAD
          else
            git checkout -q --orphan showcase-shots
          fi
          rm -rf "$PR"
          mkdir "$PR"
          cp ../shots/*.png "$PR/" 2>/dev/null || touch "$PR/.keep"
          git add -A
          git commit -q --allow-empty -m "Screenshots for #$PR"
          for attempt in 1 2 3 4 5; do
            git push -q origin showcase-shots && break
            git fetch -q --depth 1 origin showcase-shots
            git rebase -q FETCH_HEAD
          done
          sha=$(git rev-parse HEAD)
          cd ..
          section=$(sed "s|{{shots}}|https://raw.githubusercontent.com/$REPO/$sha/$PR|g" shots/section.md)
          kept=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' | sed '/^<!-- showcase-shots -->/,$d')
          # GitHub refuses a body over 65536 characters.
          if [ $((${#kept} + ${#section})) -gt 65000 ]; then
            section=$(printf '<!-- showcase-shots -->\n\n## Showcase\n\nToo many to fit here: https://github.com/%s/tree/%s/%s' "$REPO" "$sha" "$PR")
          fi
          printf '%s\n\n%s\n' "$kept" "$section" > body.md
          gh api --method PATCH "repos/$REPO/pulls/$PR" -F body=@body.md > /dev/null

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: test
      # The *.test-d.ts files sit under each package's tsconfig, so the check
      # job's tsc and vue-tsc already check them, and vitest skips its own pass.
      - name: Test
        run: pnpm turbo run test -- --typecheck.enabled=false
