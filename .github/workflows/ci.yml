name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pull requests cancel their older runs; each push to main keeps its own result.
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # runner-hub's pool (x86_64 cion, aarch64 Oracle boxes) while the repo is private:
    # it serves only private repos, so this goes back to ubuntu-latest when chelone is public.
    runs-on: [self-hosted, chelone]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Packages pack cleanly
        run: pnpm --filter "./packages/*" --if-present run check:pack
      - name: Registry is up to date
        run: |
          pnpm --dir packages/react registry:generate
          git diff --exit-code packages/react/registry.json || {
            echo "::error::registry.json is stale. Run pnpm --dir packages/react registry:generate and commit it."
            exit 1
          }
      - name: Registry builds
        run: pnpm --dir packages/react registry:build
